<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shuffl" />
    <title>Shuffl</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <link rel="stylesheet" href="/feed.css?v=4" />
  </head>
  <body>
    <!-- ---------- header ---------- -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">Shuffl</span>
        <span class="brand-sub">Review</span>
      </div>
      <div class="header-actions">
        <a id="queue-link" class="icon-btn" href="/approved.html" aria-label="Approved queue" title="Approved queue">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01" />
          </svg>
        </a>
        <button id="logout-btn" class="icon-btn" type="button" aria-label="Log out" title="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ---------- card stage ---------- -->
    <main class="stage" id="stage" aria-label="Video review feed">
      <div class="deck" id="deck"></div>
      <div class="loading" id="loading">Loading…</div>
    </main>

    <!-- ---------- empty state ---------- -->
    <div class="empty-state" id="empty-state" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="empty-icon">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3" />
      </svg>
      <h2>All caught up</h2>
      <p>No videos waiting for review. New uploads appear here automatically.</p>
    </div>

    <!-- ---------- action bar ---------- -->
    <footer class="action-bar" id="action-bar" hidden>
      <div class="swipe-hints" aria-hidden="true">
        <span class="hint hint-reject">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
          Reject
        </span>
        <span class="progress" id="progress">1 of 1</span>
        <span class="hint hint-approve">
          Approve
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
        </span>
      </div>
      <span class="skip-hint">Swipe up or down to save for later</span>
      <div class="bar-buttons">
        <button id="edit-btn" class="bar-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14" />
          </svg>
          Edit
        </button>
        <button id="comment-btn" class="comment-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
          Comment
        </button>
      </div>
    </footer>

    <!-- ---------- card template ---------- -->
    <template id="card-tpl">
      <article class="card card--current">
        <div class="media-wrap"></div>
        <div class="stamp stamp-approve">APPROVE</div>
        <div class="stamp stamp-reject">REJECT</div>
        <div class="stamp stamp-skip">LATER</div>
        <div class="play-overlay" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
        </div>
        <div class="card-foot">
          <span class="card-title"></span>
        </div>
        <button class="sound-btn" type="button" aria-label="Unmute"></button>
      </article>
    </template>

    <!-- ---------- comment sheet ---------- -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="comment-sheet" hidden aria-label="Comments" role="dialog" aria-modal="true">
      <div class="sheet-grip" aria-hidden="true"></div>
      <header class="sheet-head">
        <h2>Comments</h2>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Close comments">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </header>
      <ul class="comment-list" id="comment-list"></ul>
      <form class="comment-form" id="comment-form">
        <label class="sr-only" for="comment-input">Add a comment</label>
        <textarea
          id="comment-input"
          rows="1"
          maxlength="500"
          placeholder="Add a note…"
          required
        ></textarea>
        <button type="submit" id="comment-send" aria-label="Send comment">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z" /></svg>
        </button>
      </form>
    </section>

    <!-- ---------- review feedback sheet ---------- -->
    <div class="sheet-backdrop" id="feedback-backdrop" hidden></div>
    <section
      class="sheet feedback-sheet"
      id="feedback-sheet"
      hidden
      aria-label="Review feedback"
      role="dialog"
      aria-modal="true"
    >
      <div class="sheet-grip" aria-hidden="true"></div>
      <header class="sheet-head">
        <h2 id="feedback-title">Feedback</h2>
      </header>
      <p class="feedback-lede" id="feedback-lede">The creator sees this.</p>
      <div class="reason-chips" id="feedback-chips"></div>
      <textarea
        id="feedback-note"
        rows="2"
        maxlength="300"
        placeholder="Add a note (optional)…"
      ></textarea>
      <button class="feedback-send" id="feedback-send" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4z" />
        </svg>
        <span id="feedback-send-label">Send</span>
      </button>
    </section>

    <!-- ---------- media editor ---------- -->
    <div class="editor" id="editor" hidden role="dialog" aria-modal="true" aria-label="Edit media">
      <button class="editor-close" id="editor-cancel" type="button" aria-label="Close editor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
      <div class="editor-body" id="editor-body"></div>
      <div class="editor-bar">
        <div class="editor-bar-title" id="editor-title">Edit</div>
        <div class="trim-bar" id="trim-bar" hidden>
          <div class="trim-track" id="trim-track">
            <div class="trim-fill" id="trim-fill"></div>
            <div class="trim-playhead" id="trim-playhead"></div>
            <button class="trim-handle" id="trim-start" type="button" aria-label="Trim start"></button>
            <button class="trim-handle" id="trim-end" type="button" aria-label="Trim end"></button>
          </div>
          <div class="trim-readout" id="trim-readout">0:00 – 0:00</div>
        </div>
        <p class="editor-hint" id="crop-hint" hidden>Drag the box to frame the crop.</p>
        <div class="editor-bar-foot">
          <button class="editor-save" id="editor-save" type="button">Approve</button>
        </div>
      </div>
    </div>

    <!-- ---------- toast ---------- -->
    <div class="toast" id="toast" role="status" hidden></div>

    <script src="/video-source.js?v=5"></script>
    <script src="/app.js?v=6" type="module"></script>
  </body>
</html>

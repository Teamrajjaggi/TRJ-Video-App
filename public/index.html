<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Video Review</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="who">
        <span id="username" class="username">…</span>
        <span id="role-chip" class="role-chip" hidden></span>
        <span id="master-chip" class="role-chip master-chip" hidden>master</span>
      </div>
      <nav class="top-actions">
        <button id="sync-drive-btn" class="ghost" hidden>↻ Sync Drive</button>
        <button id="generate-btn" class="ghost" hidden>+ Generate</button>
        <a class="ghost" href="/api/preferences" target="_blank" rel="noopener">CLAUDE.md</a>
        <a class="ghost" href="/profile.html">Profile</a>
        <button id="logout-btn" class="ghost">Log out</button>
      </nav>
    </header>

    <main id="feed" class="feed" aria-label="Video feed">
      <div class="loading">Loading videos…</div>
    </main>

    <template id="card-template">
      <section class="card" data-video-id="">
        <video class="video" playsinline loop preload="metadata"></video>

        <div class="overlay">
          <div class="meta">
            <h2 class="title"></h2>
            <p class="description"></p>
            <div class="tags"></div>
            <span class="approved-chip" hidden>✓ approved</span>
          </div>

          <div class="actions">
            <button class="action like" type="button" aria-label="Approve">
              <span class="icon">👍</span>
              <span class="count like-count">0</span>
            </button>
            <button class="action dislike" type="button" aria-label="Disapprove">
              <span class="icon">👎</span>
              <span class="count dislike-count">0</span>
            </button>
            <button class="action comment-toggle" type="button" aria-label="Comments">
              <span class="icon">💬</span>
              <span class="count comment-count">0</span>
            </button>
            <button class="action delete admin-only" type="button" aria-label="Delete (admin)" hidden>
              <span class="icon">✕</span>
            </button>
          </div>
        </div>

        <aside class="comments" hidden>
          <header>
            <h3>Why?</h3>
            <button class="close" type="button" aria-label="Close comments">×</button>
          </header>
          <ul class="comment-list"></ul>
          <form class="comment-form">
            <textarea
              name="comment"
              rows="2"
              maxlength="500"
              placeholder="Leave a note on why you approved or disapproved…"
              required
            ></textarea>
            <div class="form-row">
              <label class="verdict-pick">
                <input type="radio" name="verdict" value="comment" checked />
                <span>just a note</span>
              </label>
              <label class="verdict-pick">
                <input type="radio" name="verdict" value="like" />
                <span>approve</span>
              </label>
              <label class="verdict-pick">
                <input type="radio" name="verdict" value="dislike" />
                <span>disapprove</span>
              </label>
              <button type="submit">Send</button>
            </div>
          </form>
        </aside>
      </section>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>

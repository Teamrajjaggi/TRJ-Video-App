<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Sign in · TRJ Review</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="brand">
        <img class="brand-logo" src="/icon.svg" alt="" />
        <span class="brand-name">TRJ <span>Review</span></span>
      </div>
      <h1>Sign in</h1>
      <p class="muted">Reviewer access. Sign in to review the feed.</p>
      <form id="login-form">
        <label>
          <span>Username</span>
          <input name="username" autocomplete="username" required minlength="3" />
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
        <p class="error" id="error" role="alert"></p>
      </form>
      <p class="auth-switch">
        New here? <a href="/signup.html">Create an account</a>
      </p>
    </main>
    <script type="module">
      import { jsonFetch, showError } from '/auth.js';
      const form = document.getElementById('login-form');
      const err = document.getElementById('error');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showError(err, '');
        const fd = new FormData(form);
        try {
          const data = await jsonFetch('/api/login', {
            method: 'POST',
            body: JSON.stringify({
              username: fd.get('username'),
              password: fd.get('password'),
            }),
          });
          // Creators (VAs) land on the upload page; admins on the feed.
          window.location.href =
            data && data.user && data.user.isCreator ? '/creator.html' : '/';
        } catch (e2) {
          showError(err, e2.message);
        }
      });
    </script>
  </body>
</html>

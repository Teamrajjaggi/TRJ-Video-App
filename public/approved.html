<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Approved videos · Video Review</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        overflow: auto;
        padding: max(20px, env(safe-area-inset-top)) 16px 24px;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .page-head h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      .page-head .meta-line {
        color: var(--muted);
        font-size: 0.875rem;
      }
      .filters {
        display: flex;
        gap: 6px;
        margin: 14px 0;
      }
      .filters button {
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
      }
      .filters button.active {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: 80px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .row video {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        background: #000;
      }
      .row .info {
        min-width: 0;
      }
      .row .info-title {
        font-weight: 600;
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .info-sub {
        color: var(--muted);
        font-size: 0.8125rem;
        margin-top: 2px;
      }
      .row .actions-row {
        display: flex;
        gap: 6px;
      }
      .row .actions-row button,
      .row .actions-row a {
        background: var(--surface-2);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .row .actions-row button:hover,
      .row .actions-row a:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .row .actions-row button.danger {
        border-color: rgba(255, 77, 79, 0.4);
        color: #fca5a5;
      }
      .row .actions-row button.danger:hover {
        background: rgba(255, 77, 79, 0.2);
      }
      .row.posted {
        opacity: 0.6;
      }
      .posted-chip {
        display: inline-flex;
        background: rgba(52, 211, 153, 0.18);
        color: var(--accent-like);
        font-size: 0.625rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 8px;
        border-radius: 999px;
        margin-left: 6px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
      }
      @media (max-width: 600px) {
        .row {
          grid-template-columns: 56px 1fr;
        }
        .row .actions-row {
          grid-column: 1 / -1;
          flex-wrap: wrap;
        }
        .row video {
          width: 56px;
          height: 56px;
        }
      }
    </style>
  </head>
  <body class="auth-body">
    <div style="width: min(900px, 100%);">
      <header class="page-head">
        <div>
          <h1>Approved queue</h1>
          <div class="meta-line" id="meta-line">Loading…</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a class="ghost" href="/">← back to feed</a>
          <button class="ghost" id="download-json">Download JSON</button>
        </div>
      </header>

      <div class="filters">
        <button data-filter="unposted" class="active">Ready to post</button>
        <button data-filter="posted">Already posted</button>
        <button data-filter="all">All</button>
      </div>

      <div class="rows" id="rows">
        <div class="empty">Loading approved videos…</div>
      </div>
    </div>

    <script type="module">
      import { jsonFetch, getMe } from '/auth.js';

      const me = await getMe();
      if (!me) {
        window.location.href = '/login.html';
      }
      if (me && me.role !== 'admin') {
        document.body.innerHTML = '<div class="empty" style="padding:80px 20px;">Admin only.</div>';
      }

      const rowsEl = document.getElementById('rows');
      const metaLine = document.getElementById('meta-line');
      let current = 'unposted';

      document.querySelectorAll('.filters button').forEach((b) => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.filters button').forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          current = b.dataset.filter;
          load();
        });
      });

      document.getElementById('download-json').addEventListener('click', async () => {
        const data = await jsonFetch(`/api/admin/approved?filter=${current}`);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `approved-${current}-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });

      async function load() {
        rowsEl.innerHTML = '<div class="empty">Loading…</div>';
        const items = await jsonFetch(`/api/admin/approved?filter=${current}`);
        metaLine.textContent = `${items.length} video${items.length === 1 ? '' : 's'}`;
        if (items.length === 0) {
          rowsEl.innerHTML = `<div class="empty">No videos in this view yet.</div>`;
          return;
        }
        rowsEl.innerHTML = '';
        for (const v of items) {
          const row = document.createElement('div');
          row.className = 'row' + (v.postedAt ? ' posted' : '');

          const vid = document.createElement('video');
          vid.src = v.src;
          vid.muted = true;
          vid.playsInline = true;
          vid.loop = true;
          vid.addEventListener('mouseenter', () => vid.play().catch(() => {}));
          vid.addEventListener('mouseleave', () => vid.pause());
          row.appendChild(vid);

          const info = document.createElement('div');
          info.className = 'info';
          const title = document.createElement('div');
          title.className = 'info-title';
          title.textContent = v.title;
          if (v.postedAt) {
            const chip = document.createElement('span');
            chip.className = 'posted-chip';
            chip.textContent = 'posted';
            title.appendChild(chip);
          }
          const sub = document.createElement('div');
          sub.className = 'info-sub';
          const tags = Array.isArray(v.tags) ? v.tags.slice(0, 4).join(' · ') : '';
          sub.textContent = `approved ${new Date(v.approvedAt).toLocaleString()}${tags ? ' · ' + tags : ''}`;
          info.appendChild(title);
          info.appendChild(sub);
          row.appendChild(info);

          const actions = document.createElement('div');
          actions.className = 'actions-row';

          const openLink = document.createElement('a');
          openLink.href = v.src;
          openLink.target = '_blank';
          openLink.rel = 'noopener';
          openLink.textContent = 'Open';
          actions.appendChild(openLink);

          if (!v.postedAt) {
            const markBtn = document.createElement('button');
            markBtn.textContent = 'Mark as posted';
            markBtn.addEventListener('click', async () => {
              if (!confirm('Mark this video as posted? (For now this is a manual flag; auto-post worker will do it later.)')) return;
              try {
                await jsonFetch(`/api/admin/approved/${encodeURIComponent(v.id)}/posted`, {
                  method: 'POST',
                  body: JSON.stringify({ targets: ['manual'] }),
                });
                load();
              } catch (e) {
                alert(`Failed: ${e.message}`);
              }
            });
            actions.appendChild(markBtn);
          }

          const removeBtn = document.createElement('button');
          removeBtn.className = 'danger';
          removeBtn.textContent = 'Un-approve';
          removeBtn.addEventListener('click', async () => {
            if (!confirm('Remove this video from the approval queue? The video stays in the feed.')) return;
            try {
              await jsonFetch(`/api/admin/approved/${encodeURIComponent(v.id)}`, { method: 'DELETE' });
              load();
            } catch (e) {
              alert(`Failed: ${e.message}`);
            }
          });
          actions.appendChild(removeBtn);

          row.appendChild(actions);
          rowsEl.appendChild(row);
        }
      }

      load();
    </script>
  </body>
</html>

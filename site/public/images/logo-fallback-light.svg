<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 386" role="img" aria-label="Team Raj Jaggi">
  <title>Team Raj Jaggi</title>
  <!--
    Vector rebuild of the TRJ lockup: navy monogram with a roofline and window
    cut into it, red wordmark beneath. Type is set in the site's own display
    sans so the mark stays crisp at any size; the SVG is inlined into the page
    (not loaded through <img>) so that webfont applies.
  -->
  <g font-family="'DM Sans', 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <!-- monogram -->
    <text x="330" y="252" text-anchor="middle" font-size="248" letter-spacing="-10" fill="#ffffff">TRJ</text>

    <!-- roofline and chimney knocked out of the letterforms -->
    <g fill="none" stroke="#161a45" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <path d="M214 258 L214 196 L268 150 L322 196 L322 258"/>
      <path d="M232 182 L232 146 L248 146 L248 168"/>
    </g>
    <g fill="none" stroke="#161a45" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M219 256 L219 199 L268 157 L317 199 L317 256"/>
      <path d="M236 179 L236 150 L244 150 L244 171"/>
    </g>

    <!-- window -->
    <g fill="#d0202f">
      <rect x="286" y="196" width="20" height="20" rx="2"/>
      <rect x="312" y="196" width="20" height="20" rx="2"/>
      <rect x="286" y="222" width="20" height="20" rx="2"/>
      <rect x="312" y="222" width="20" height="20" rx="2"/>
    </g>

    <!-- wordmark -->
    <text x="330" y="356" text-anchor="middle" font-size="62" letter-spacing="1.5" fill="#ffffff">TEAM RAJ JAGGI</text>
  </g>
</svg>
